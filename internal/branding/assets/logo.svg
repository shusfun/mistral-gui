<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <title>mistral</title>
  <defs>
    <linearGradient id="mg-bg" x1="64" y1="36" x2="448" y2="476" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#143656"/>
      <stop offset="52%" stop-color="#0D2238"/>
      <stop offset="100%" stop-color="#081423"/>
    </linearGradient>
    <radialGradient id="mg-glow" cx="256" cy="128" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.22"/>
